name: tests

# The suite stands in for azure.functions and pyodbc, so it needs neither an
# ODBC driver nor an Azure account: it pins the ingestion logic, not the cloud.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest requests
      - run: python -m pytest -q
